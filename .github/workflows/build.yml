name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Create gradlew script
      run: |
        # Создаем gradlew
        cat > gradlew << 'EOF'
        #!/bin/sh
        #
        # Copyright © 2015-2021 the original authors.
        #
        # Licensed under the Apache License, Version 2.0 (the "License");
        # you may not use this file except in compliance with the License.
        # You may obtain a copy of the License at
        #
        #      https://www.apache.org/licenses/LICENSE-2.0
        #
        # Unless required by applicable law or agreed to in writing, software
        # distributed under the License is distributed on an "AS IS" BASIS,
        # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        # See the License for the specific language governing permissions and
        # limitations under the License.
        #

        ##############################################################################
        #
        #   Gradle start up script for POSIX generated by Gradle.
        #
        #   Important for running:
        #
        #   (1) You need a POSIX-compliant shell to run this script. If your /bin/sh is
        #       noncompliant, but you have some other compliant shell such as ksh or
        #       bash, then run 'sh' with that shell as the first argument, like this:
        #       sh myscript.sh /bin/bash
        #
        #       The list of known POSIX-compliant shells includes:
        #       - bash (version 2.0 or newer)
        #       - dash (version 0.5.11 or newer)
        #       - ksh (version 1.0 or newer)
        #       - sh (provided by GNU coreutils)
        #       - zsh (version 4.3.10 or newer)
        #
        #   (2) If you are using a POSIX-compliant shell, you need to set the JAVA_HOME
        #       environment variable to point to a Java installation (version 11 or newer).
        #
        ##############################################################################

        # --- Gradle wrapper startup script ---

        # Use the maximum available file descriptors for better performance
        if [ -n "$(command -v ulimit)" ] ; then
            ulimit -n 65536 2>/dev/null || ulimit -n 4096 2>/dev/null || true
        fi

        # Determine the Java command to use to start the JVM.
        if [ -n "$JAVA_HOME" ] ; then
            if [ -x "$JAVA_HOME/jre/sh/java" ] ; then
                # IBM's JDK on AIX uses strange locations for the executables
                JAVACMD="$JAVA_HOME/jre/sh/java"
            else
                JAVACMD="$JAVA_HOME/bin/java"
            fi
            if [ ! -x "$JAVACMD" ] ; then
                die "ERROR: JAVA_HOME is set to an invalid directory: $JAVA_HOME

        Please set the JAVA_HOME variable in your environment to match the
        location of your Java installation."
            fi
        else
            JAVACMD="java"
            if ! command -v java >/dev/null 2>&1; then
                die "ERROR: JAVA_HOME is not set and no 'java' command could be found in your PATH.

        Please set the JAVA_HOME variable in your environment to match the
        location of your Java installation."
            fi
        fi

        # Increase the maximum file descriptors if we can.
        if [ -n "$(command -v ulimit)" ] ; then
            ulimit -n 65536 2>/dev/null || ulimit -n 4096 2>/dev/null || true
        fi

        # Collect all arguments for the java command, following the shell quoting and substitution rules
        eval set -- $DEFAULT_JVM_OPTS $JAVA_OPTS $GRADLE_OPTS "\"-Dorg.gradle.appname=$APP_BASE_NAME\"" -classpath "\"$CLASSPATH\"" org.gradle.wrapper.GradleWrapperMain "$APP_ARGS"

        # by default we should be in the correct project dir, but when run from Finder on Mac, the cwd is wrong
        if [ "$(uname)" = "Darwin" ] && [ "$HOME" = "$PWD" ]; then
          cd "$(dirname "$0")"
        fi

        exec "$JAVACMD" "$@"
        EOF
        
        chmod +x gradlew
        
        # Создаем gradle-wrapper.jar
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
        
        # Создаем gradle-wrapper.properties
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build APK
      run: ./gradlew assembleRelease --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FileExplorer-APK
        path: app/build/outputs/apk/release/*.apk
